.summit-container {
  background: var(--color-background-primary, #0f172a);
  color: var(--color-text-primary, #e2e8f0);
  font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif);
  min-height: 100vh;
  padding: 0.75rem;
}
.summit-tabs {
  display: flex;
  gap: 2px;
  margin-bottom: 0.75rem;
  background: var(--color-background-secondary, #1e293b);
  border-radius: var(--border-radius-sm, 0.5rem);
  padding: 3px;
}
.summit-tab {
  flex: 1;
  padding: 0.5rem;
  border: none;
  border-radius: var(--border-radius-sm, 0.5rem);
  background: transparent;
  color: var(--color-text-secondary, #94a3b8);
  font-size: 0.8rem;
  font-weight: 400;
  cursor: pointer;
  transition: all 0.15s;
}
.summit-tab--active {
  background: var(--color-text-accent, #818cf8);
  color: var(--nb-color-accent-foreground, #ffffff);
  font-weight: 600;
}
.summit-day-picker {
  display: flex;
  gap: 4px;
  margin-bottom: 0.75rem;
}
.summit-day-btn {
  flex: 1;
  padding: 0.4rem;
  border: 1px solid var(--color-border-primary, #334155);
  border-radius: var(--border-radius-sm, 0.5rem);
  background: transparent;
  color: var(--color-text-primary, #e2e8f0);
  font-size: 0.75rem;
  cursor: pointer;
  font-weight: 400;
}
.summit-day-btn--active {
  border-color: var(--color-text-accent, #818cf8);
  background: var(--color-text-accent, #818cf8);
  color: var(--nb-color-accent-foreground, #ffffff);
  font-weight: 600;
}
.summit-card {
  background: var(--color-background-secondary, #1e293b);
  border: 1px solid var(--color-border-primary, #334155);
  border-radius: var(--border-radius-sm, 0.5rem);
  padding: 0.75rem;
  margin-bottom: 0.5rem;
}
.summit-card--clickable {
  cursor: pointer;
  transition: border-color 0.15s;
}
.summit-card--clickable:hover {
  border-color: var(--color-text-accent, #818cf8);
}
.summit-session-title {
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--color-text-primary, #e2e8f0);
  margin-bottom: 2px;
}
.summit-session-meta {
  font-size: 0.7rem;
  color: var(--color-text-secondary, #94a3b8);
}
.summit-time-slot-header {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--color-text-accent, #818cf8);
  padding: 0.5rem 0 0.25rem;
  border-bottom: 1px solid var(--color-border-primary, #334155);
  margin-bottom: 0.5rem;
}
.summit-bookmark-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  padding: 2px 4px;
  color: var(--color-text-secondary, #94a3b8);
  opacity: 0.5;
  transition: all 0.15s;
}
.summit-bookmark-btn--active {
  color: #eab308;
  opacity: 1;
}
.summit-input {
  flex: 1;
  padding: 0.5rem 0.6rem;
  border-radius: var(--border-radius-sm, 0.5rem);
  border: 1px solid var(--color-border-primary, #334155);
  background: var(--color-background-secondary, #1e293b);
  color: var(--color-text-primary, #e2e8f0);
  font-size: 0.85rem;
  outline: none;
}
.summit-btn {
  padding: 0.5rem 1rem;
  border-radius: var(--border-radius-sm, 0.5rem);
  border: none;
  background: var(--color-text-accent, #818cf8);
  color: var(--nb-color-accent-foreground, #ffffff);
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
}
.summit-btn--outline {
  background: transparent;
  border: 1px solid var(--color-border-primary, #334155);
  color: var(--color-text-primary, #e2e8f0);
}
.summit-btn--unbookmark {
  background: transparent;
  border: 1px solid var(--color-border-primary, #334155);
  color: var(--color-text-secondary, #94a3b8);
}
.summit-badge {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.6rem;
  font-weight: 600;
  text-transform: uppercase;
  margin-right: 4px;
  background: #64748b22;
  color: #64748b;
}
.summit-badge--keynote { background: #eab30822; color: #eab308; }
.summit-badge--talk { background: #6366f122; color: #6366f1; }
.summit-badge--workshop { background: #22c55e22; color: #22c55e; }
.summit-badge--break { background: #64748b22; color: #64748b; }
.summit-badge--social { background: #ec489922; color: #ec4899; }
.summit-badge--sponsor_activity { background: #f9731622; color: #f97316; }
.summit-badge--track {
  background: color-mix(in srgb, var(--color-text-accent, #818cf8) 13%, transparent);
  color: var(--color-text-accent, #818cf8);
}
.summit-priority-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #64748b;
  margin-right: 6px;
}
.summit-priority-dot--must { background: #ef4444; }
.summit-priority-dot--want { background: #eab308; }
.summit-empty {
  text-align: center;
  padding: 2rem;
  color: var(--color-text-secondary, #94a3b8);
  font-size: 0.85rem;
}
.summit-modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}
.summit-modal {
  background: var(--color-background-secondary, #1e293b);
  border: 1px solid var(--color-border-primary, #334155);
  border-radius: 12px 12px 0 0;
  padding: 1.25rem;
  width: 100%;
  max-width: 600px;
  max-height: 80vh;
  overflow-y: auto;
  color: var(--color-text-primary, #e2e8f0);
}
.summit-modal-close {
  background: none;
  border: none;
  color: var(--color-text-secondary, #94a3b8);
  font-size: 1.5rem;
  cursor: pointer;
  padding: 0 0.25rem;
  line-height: 1;
}
.summit-label {
  color: var(--color-text-secondary, #94a3b8);
  font-size: 0.7rem;
  text-transform: uppercase;
  margin-bottom: 2px;
}
.summit-speaker-photo {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
}
.summit-speaker-photo--lg {
  width: 48px;
  height: 48px;
}
.summit-speaker-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: color-mix(in srgb, var(--color-text-accent, #818cf8) 20%, transparent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1rem;
  color: var(--color-text-accent, #818cf8);
  flex-shrink: 0;
}
.summit-speaker-avatar--lg {
  width: 48px;
  height: 48px;
  font-size: 1.1rem;
}
.summit-topic-tag {
  font-size: 0.6rem;
  padding: 1px 5px;
  border-radius: 3px;
  background: color-mix(in srgb, var(--color-text-accent, #818cf8) 8%, transparent);
  color: var(--color-text-accent, #818cf8);
  border: 1px solid color-mix(in srgb, var(--color-text-accent, #818cf8) 20%, transparent);
}
.summit-link {
  color: var(--color-text-accent, #818cf8);
  font-size: 0.7rem;
  text-decoration: none;
  cursor: pointer;
}
.summit-link:visited,
.summit-link:active {
  color: var(--color-text-accent, #818cf8);
}
.summit-border-top {
  border-top: 1px solid var(--color-border-primary, #334155);
}
.summit-border-bottom {
  border-bottom: 1px solid color-mix(in srgb, var(--color-border-primary, #334155) 13%, transparent);
}
.summit-muted {
  color: var(--color-text-secondary, #94a3b8);
}
.summit-accent {
  color: var(--color-text-accent, #818cf8);
}
